name: Release
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      - run: npm ci
      - run: npm run lint
      - run: test "v$(node -p "require('./projects/support-chat/package.json').version")" = "$GITHUB_REF_NAME" && test "v$(node -p "require('./projects/support-chat-element/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run build
      - run: npm pack ./dist/support-chat
      - run: npm pack ./dist/support-chat-element
      - run: npm publish ./espressotutorialsgmbh-et-espressi-support-chat-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish ./espressotutorialsgmbh-et-espressi-support-chat-element-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
